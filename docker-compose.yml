version: '3.8'

services:
  # -------------------------------------------------------------
  # Express Backend API Service
  # -------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resume_builder_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - resume_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------
  # Nginx Reverse Proxy & React Production SPA
  # -------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: resume_builder_client
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - resume_network

  # -------------------------------------------------------------
  # Standalone Single-Container Deployment (Optional)
  # Run with: docker-compose --profile standalone up
  # -------------------------------------------------------------
  standalone:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_builder_app
    restart: unless-stopped
    ports:
      - "8080:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    profiles:
      - standalone
    networks:
      - resume_network

networks:
  resume_network:
    driver: bridge
